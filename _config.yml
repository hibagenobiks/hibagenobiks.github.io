# =============================================================
#  Site settings — edit this file first.
#  After changing _config.yml you must restart `jekyll serve`
#  (Jekyll only reads this file once at startup).
# =============================================================

title: Hiba Ali
tagline: Neurogenomics · Clinical genomics · Parkinson's disease
description: >-
  Notes and writing by Hiba Ali on neurogenomics, whole-genome sequencing,
  clinical variant interpretation and the genetics of Parkinson's disease.
url: "https://hibagenobiks.github.io"   # your site address, no trailing slash
baseurl: ""                              # leave empty for a <username>.github.io site
lang: en

author:
  name: Hiba Ali
  pronouns: she/her
  role: Genomics researcher
  location: Bengaluru, India
  # Short bio shown on the home page. Write it in first person or third person.
  bio: >-
    I work on the genetic architecture of Parkinson's disease in Indian cohorts,
    using whole-genome sequencing to find disease-causing variants that
    European-centred studies miss. I write here about neurogenomics, the
    practical details of sequencing analysis, and neuroscience more broadly.
  # Leave any of these empty ("") and the icon is simply hidden.
  email: ""            # e.g. you@example.com
  github: hibagenobiks
  orcid: ""            # e.g. 0000-0000-0000-0000
  linkedin: ""         # the part after linkedin.com/in/
  scholar: ""          # Google Scholar user id
  bluesky: ""          # e.g. yourname.bsky.social
  cv_pdf: ""           # e.g. /files/Hiba_Ali_CV.pdf  (put the PDF in /files)

# Blog / notes
posts_per_page_home: 4
show_reading_time: true
words_per_minute: 200

# ---- Build settings (normally no need to touch) ----
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge
highlighter: rouge

permalink: /notes/:title/

plugins:            # all three are allowed on GitHub Pages
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope: { path: "", type: posts }
    values:
      layout: post
      toc: true
  - scope: { path: "" }
    values:
      layout: page

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
  - node_modules

{%- comment -%}
  Usage inside a post:
  {% include figure.html
     src="/images/reference-genome/fig1.png"
     alt="Short description for screen readers"
     caption="**Figure 1.** Caption text — Markdown allowed."
     wide=true %}
{%- endcomment -%}
<figure class="figure{% if include.wide %} figure-wide{% endif %}">
  <img src="{{ include.src | relative_url }}" alt="{{ include.alt | default: include.caption | markdownify | strip_html | strip | escape }}" loading="lazy">
  {%- if include.caption -%}
  <figcaption>{{ include.caption | markdownify | remove: '<p>' | remove: '</p>' }}</figcaption>
  {%- endif -%}
</figure>
